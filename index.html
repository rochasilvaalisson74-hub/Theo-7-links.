<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="NOTFAKE T7 — acesse nossas redes e links oficiais.">
  <title>NOTFAKE T7 | Links Oficiais</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --purple: #a855f7;
      --pink: #ec4899;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        linear-gradient(rgba(8, 5, 18, .48), rgba(8, 5, 18, .72)),
        url("https://raw.githubusercontent.com/rochasilvaalisson74-hub/Theo-7-links./main/file_00000000004c820e9a01bd385faa25c1.png")
        center / cover fixed no-repeat;
    }

    .glow {
      position: fixed;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: var(--purple);
      filter: blur(110px);
      opacity: .24;
      pointer-events: none;
      animation: glowMove 8s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -70px;
      left: -80px;
    }

    .glow.two {
      right: -90px;
      bottom: -80px;
      background: var(--pink);
      animation-delay: -4s;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 410px;
      padding: 34px 24px 26px;
      text-align: center;
      background: rgba(12, 9, 24, .76);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 28px;
      box-shadow:
        0 20px 70px rgba(0, 0, 0, .48),
        0 0 35px rgba(168, 85, 247, .12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: cardEnter .8s ease both;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 0 30px rgba(168, 85, 247, .35);
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -2px;
      animation: logoFloat 4s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(27px, 7vw, 35px);
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 9px;
      text-shadow: 0 0 24px rgba(168, 85, 247, .4);
    }

    .subtitle {
      color: #d5cde4;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 27px;
    }

    .line {
      width: 64px;
      height: 3px;
      border-radius: 10px;
      margin: 0 auto 25px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 15px 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 15px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .7px;
      background: rgba(255, 255, 255, .075);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease,
        background .25s ease;
      animation: linkEnter .65s ease both;
    }

    .link:nth-child(1) { animation-delay: .15s; }
    .link:nth-child(2) { animation-delay: .25s; }
    .link:nth-child(3) { animation-delay: .35s; }
    .link:nth-child(4) { animation-delay: .45s; }

    .link::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      transform: skewX(-25deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .18),
        transparent
      );
      transition: left .55s ease;
    }

    .link:hover::before {
      left: 150%;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-3px) scale(1.015);
      border-color: rgba(216, 180, 254, .85);
      background: rgba(168, 85, 247, .17);
      box-shadow: 0 0 22px rgba(168, 85, 247, .23);
      outline: none;
    }

    .link.primary {
      border-color: transparent;
      background: linear-gradient(110deg, #7c3aed, #c026d3);
      box-shadow: 0 7px 24px rgba(124, 58, 237, .25);
    }

    .link.primary:hover {
      box-shadow: 0 0 28px rgba(192, 38, 211, .4);
    }

    .icon {
      position: absolute;
      left: 17px;
      font-size: 19px;
    }

    .footer {
      margin-top: 26px;
      color: #aaa0bd;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes linkEnter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes glowMove {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 25px) scale(1.15); }
    }

    @media (max-width: 480px) {
      body {
        background-attachment: scroll;
      }

      .card {
        padding: 29px 19px 23px;
        border-radius: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
